<title>Exam</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#221b14;--paper:#efe4c8;--paper2:#e6d7ac;--red:#a3301f;--gold:#c9972e;--gold2:#e8c36a;--cream:#f8f1de;--line:rgba(34,27,20,.18);--mute:#6b5a45;--ok:#2f7a3e;--sh:6px 6px 0 var(--ink);--sh2:4px 4px 0 var(--ink);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Space Grotesk","Cairo",system-ui,sans-serif;line-height:1.6;background:var(--paper);overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 2px 2px,rgba(34,27,20,.14) 1.4px,transparent 0);background-size:26px 26px;opacity:.5}
.landmarks{position:fixed;inset:0;z-index:0;pointer-events:none}.landmark{position:absolute;color:var(--ink);opacity:.14}.landmark svg{width:100%;height:100%;display:block}
.landmark--gate{width:78px;height:78px;top:9%;inset-inline-start:4%;animation:fa 8s ease-in-out infinite}.landmark--tower{width:96px;height:96px;top:42%;inset-inline-end:3%;color:var(--red);animation:fb 9.5s ease-in-out infinite}.landmark--dom{width:86px;height:86px;top:78%;inset-inline-start:5%;animation:fa 7s ease-in-out infinite 1s}
@keyframes fa{50%{transform:translateY(-14px)}}@keyframes fb{50%{transform:translateY(12px)}}@media(max-width:1100px){.landmarks{display:none}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:14px 14px 40px}
[hidden]{display:none!important}
.card{background:var(--cream);border:2px solid var(--ink);border-radius:4px;box-shadow:var(--sh)}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--cream);border:2px solid var(--ink);border-bottom:0;border-radius:4px 4px 0 0}
.av{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);object-fit:cover;flex:none}
.top b{font-size:.95rem;line-height:1.2}.top small{display:block;font-weight:500;color:var(--red);font-size:.75rem}
.pill,.mapbtn{margin-inline-start:auto;background:var(--ink);color:var(--paper);border:0;border-radius:2px;padding:6px 14px;font:700 .9rem "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.pill.low{background:var(--red);animation:pl 1s infinite}@keyframes pl{50%{opacity:.55}}
.mapbtn{margin:0;background:var(--gold);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.prog{height:10px;background:var(--paper2);border:2px solid var(--ink);border-bottom:0}.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.grid{display:grid;gap:18px;margin-top:0}.dockwrap{box-shadow:var(--sh);border-radius:0 0 4px 4px}
.body{padding:22px 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{background:var(--gold2);border:2px solid var(--ink);border-radius:2px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pass{background:var(--paper);border:2px solid var(--ink);border-inline-start:8px solid var(--red);border-radius:2px;padding:12px 14px;margin:0 0 14px;font-size:.98rem}
h1,h2{margin:0}.q{font-size:clamp(1.15rem,4.4vw,1.6rem);font-weight:700;line-height:1.35;margin:4px 0 16px}
.word{background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:5px 5px 0 var(--red);text-align:center;padding:16px;margin:0 4px 20px}
.word b{display:block;font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.25}.word small{color:var(--mute)}
.arw{font-family:Cairo,'DejaVu Sans',sans-serif;font-size:clamp(2.4rem,11vw,3.6rem)!important}
.spk{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;margin:10px auto 0;border:2px solid var(--ink);background:var(--gold);box-shadow:var(--sh2);font-size:1.3rem;cursor:pointer}.spk:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;font:500 1rem "Space Grotesk",sans-serif;color:var(--ink);background:var(--cream);border:2px solid var(--ink);border-radius:4px;box-shadow:var(--sh2);padding:12px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s;min-height:52px}
.opt i{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 .85rem "Space Grotesk",sans-serif;font-style:normal}
.opt:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.sel{background:var(--red);color:#fff;transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}.opt.sel i{background:var(--gold2);color:var(--ink)}
.opt span[lang=ar]{font:700 1.2rem Cairo,sans-serif;flex:1}.tf{grid-template-columns:1fr 1fr}
input[type=text]{width:100%;font:500 1.05rem "Space Grotesk",sans-serif;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:4px;box-shadow:inset 3px 3px 0 var(--line);padding:14px 16px}
.dock{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper2);border:2px solid var(--ink);border-radius:0 0 4px 4px}
.btn{font:700 .95rem "Space Grotesk",sans-serif;color:var(--ink);background:var(--cream);border:2px solid var(--ink);border-radius:4px;box-shadow:var(--sh2);padding:11px 18px;cursor:pointer;min-height:46px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:var(--sh2)}
.btn.g{background:var(--gold);flex:1}.btn.mk.on{background:var(--red);color:#fff}.btn.big{width:100%;font-size:1.05rem;padding:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
aside{position:fixed;inset:auto 0 0 0;z-index:20;max-height:82vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:4px 4px 0 0;transform:translateY(105%);transition:transform .25s}
aside.open{transform:none}.shade{position:fixed;inset:0;background:rgba(34,27,20,.5);z-index:19}aside h3{margin:0 0 10px;font-size:1rem}
.leg{font-size:.78rem;line-height:2;color:var(--mute);margin-bottom:12px}.leg span{margin-inline-end:12px;white-space:nowrap}
.dot{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:.6rem;color:#fff;vertical-align:middle;margin-inline-end:5px;background:var(--paper2);border:1.5px solid var(--ink);font-style:normal}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.map button{aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 .9rem "Space Grotesk",sans-serif;cursor:pointer}
.map .a,.dot.a{background:var(--ink);color:var(--paper)}.map .u,.dot.u{background:var(--red);color:#fff}.map .r,.dot.r{background:var(--gold);color:var(--ink)}.map .c{outline:3px solid var(--red);outline-offset:2px}
.center{text-align:center}.intro{position:relative;overflow:hidden;padding:34px 22px 28px}
.intro>*:not(.shape){position:relative;z-index:1;animation:up .6s cubic-bezier(.16,1,.3,1) both}
.intro>.av{animation-name:pop}@keyframes up{from{opacity:0;transform:translateY(18px)}}@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-8deg)}}
.shape{position:absolute;z-index:0}.shape.circle{width:150px;height:150px;background:var(--gold);border-radius:50%;top:-44px;inset-inline-end:-46px}
.shape.triangle{width:0;height:0;border-inline:62px solid transparent;border-bottom:108px solid var(--red);bottom:-34px;inset-inline-start:-36px}.shape.square{width:38px;height:38px;background:var(--ink);top:22px;inset-inline-start:22px;transform:rotate(14deg)}
.intro .av{width:120px;height:120px;border:4px solid var(--ink);box-shadow:var(--sh2);margin:0 auto}
.intro h1{font-size:clamp(2rem,8vw,2.8rem);font-weight:700;margin-top:14px}.intro .sub{margin:2px 0 0;color:var(--mute);font-weight:500}.intro .sub em{display:block;font-style:normal;color:var(--red);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stats div{background:var(--cream);border:2px solid var(--ink);border-radius:4px;box-shadow:var(--sh2);padding:10px 4px;color:var(--mute);font-size:.8rem;font-weight:500}.stats b{display:block;font-size:1.5rem;color:var(--ink)}
.ins{text-align:start;font-size:.92rem;margin:0 0 18px;padding-inline-start:20px}.ins li{margin:6px 0}
.lab{display:block;text-align:start;font-weight:700;font-size:.85rem;margin:0 0 6px}
.ring{--p:0;width:190px;height:190px;border-radius:50%;margin:16px auto;display:grid;place-items:center;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--paper2) 0);border:3px solid var(--ink);box-shadow:var(--sh2)}
.ring div{width:146px;height:146px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);display:grid;place-items:center;font-size:3rem;font-weight:700;line-height:1}.ring small{display:block;font-size:.8rem;color:var(--mute);font-weight:500}
.bars{text-align:start;margin:14px 0}.brow{display:flex;justify-content:space-between;font-size:.88rem;margin-top:8px;font-weight:500}.bar{height:10px;border:2px solid var(--ink);background:var(--paper);overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.rev{text-align:start;margin-top:10px}.rev div{border-top:2px dashed var(--line);padding:10px 0;font-size:.88rem}.rev .x{color:var(--red);font-weight:700}.rev .v{color:var(--ok);font-weight:700}
.cert{width:100%;border:2px solid var(--ink);box-shadow:var(--sh2);margin-top:10px}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(34,27,20,.55);padding:16px}.modal .card{max-width:380px;padding:22px;text-align:center}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1}
@media(min-width:900px){.wrap{padding:28px 20px 50px}.body{padding:30px 34px}.grid{grid-template-columns:1fr 300px;align-items:start}aside{position:sticky;top:78px;inset:auto;transform:none;border-radius:4px;max-height:none;padding:18px;margin-top:18px}.shade,.mapbtn,.closemap{display:none!important}.grid .dockwrap{grid-column:1}.opts.two{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.btn,.pill,.mapbtn,.map button,.opt i,.dot,.chip,.top b,.lab,.stats div,.ins,.leg,.brow,.rev,.sub,h2,h3,.modal p,.word small,#sent{font-family:Cairo,sans-serif}
.btn,.pill,.mapbtn,.map button,.chip{font-weight:800}.btn{font-size:1.05rem}.mapbtn{font-size:.95rem}
.intro h1{font-family:Cairo,sans-serif;font-weight:900;line-height:1.3}.intro .sub{font-weight:700}.stats b{font-family:Cairo,sans-serif;font-weight:900}
.lab{font-size:.95rem;font-weight:800}.ins{font-size:1rem;font-weight:600}.top b{font-weight:800}.top small{font-weight:700}
.q,.pass,.opts,input[type=text]{direction:ltr;text-align:left;font-family:"Space Grotesk",Cairo,sans-serif}
.q[dir=rtl]{direction:rtl;text-align:right;font-family:Cairo,sans-serif;font-weight:800}
#nm{direction:rtl;text-align:right;font-family:Cairo,sans-serif;font-weight:600}#nm:placeholder-shown{text-align:right}
#in::placeholder{font-family:Cairo,sans-serif;direction:rtl}
.rev .x,.rev .v{font-weight:800}.rev div{line-height:1.8}
.map{direction:ltr}

<div class="wrap">

  <div class="shape circle" aria-hidden="true"></div><div class="shape triangle" aria-hidden="true"></div><div class="shape square" aria-hidden="true"></div>
  <img class="av" id="avi" style="width:128px;height:128px" alt="">

  <div class="rev" id="rev" hidden></div>
  <button class="btn big" style="margin-top:14px" onclick="location.reload()" data-u="again"></button>
</section>

 let h=`<div class="chips"><span class="chip">${s1(q.s)}</span><span class="chip">${T.q} ${i+1} ${T.of} ${Q.length} · ${fmt(q.m)} ${q.m===1?T.mk:T.mks}</span></div>`;
 if(q.p)h+=`<p class="pass">${esc(q.p).replace(/\n/g,'<br>')}</p>`;
 if(q.img)h+=`<img class="qimg" alt="" src="${q.img}">`;
 h+=`<h2 class="q">${esc(q.q)}</h2>`;
 const sp=q.say||(q.ea?q.w:'');
 if(q.w&&q.ea)h+=`<div class="word"><b>${esc(q.w)}</b><small>${esc(q.ipa||'')}</small><br><button class="spk" id="spk" aria-label="${T.hear}">🔊</button><small>${T.tap}</small></div>`;

 else h+=`<input id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.t==='i'?T.tfill:T.tsent}" value="${esc(S.ans[i]||'')}">`;
 $('#qb').innerHTML=h;$('#secname').textContent=SEC[q.s].name;
 $('#prev').disabled=i===0;$('#next').textContent=i===Q.length-1?T.rs:T.next;
 $('#mark').textContent=S.mk[i]?T.marked:T.mark;$('#mark').classList.toggle('on',!!S.mk[i]);

  return `<div class="brow"><span>${esc(s.name)}</span><b dir="ltr">${fmt(g)}/${fmt(t)}</b></div><div class="bar"><i style="width:${t?g/t*100:0}%"></i></div>`}).join('');
 const wrong=Q.map((q,i)=>i).filter(i=>!ok(i));

  return `<div><b>${i+1}.</b> ${esc(q.q)}<br><span class="x">${T.your}: ${has(i)?esc(S.ans[i]):T.none}</span><br><span class="v">${T.corr}: ${esc(c)}</span></div>`}).join(''):`<div>${T.perfect}</div>`;
 cert(name,sc,tot);send(sc,tot)}
function cert(name,sc,tot){const F=AR?'Cairo,sans-serif':'Poppins,sans-serif',c=document.createElement('canvas');c.width=1200;c.height=850;const x=c.getContext('2d');
 const fit=(t,w,px,wt)=>{let p=px;do{x.font=`${wt} ${p}px ${F}`;p-=2}while(x.measureText(t).width>w&&p>18);return x.measureText(t).width};
 const dia=(cx,cy,r,f,st)=>{x.beginPath();x.moveTo(cx,cy-r);x.lineTo(cx+r,cy);x.lineTo(cx,cy+r);x.lineTo(cx-r,cy);x.closePath();if(f){x.fillStyle=f;x.fill()}if(st){x.strokeStyle=st;x.lineWidth=2;x.stroke()}};

 const draw=im=>{
  const g=x.createLinearGradient(0,0,1200,850);g.addColorStop(0,'#efe4c8');g.addColorStop(1,'#e2d1a2');x.fillStyle=g;x.fillRect(0,0,1200,850);
  x.fillStyle='#221b14';x.fillRect(46,46,1116,766);

  x.strokeStyle='#221b14';x.lineWidth=3;x.strokeRect(40,40,1116,766);

  x.strokeStyle='#221b14';x.lineWidth=2;x.strokeRect(88,88,1020,670);
  [[62,62],[1134,62],[62,784],[1134,784]].forEach(p=>{dia(p[0],p[1],20,'#c9972e','#221b14');dia(p[0],p[1],7,'#a3301f')});
  x.textAlign='center';x.textBaseline='alphabetic';
  if(im){x.drawImage(im,528,94,144,144)}
  x.fillStyle='#221b14';x.font=`800 54px ${F}`;fit(T.ct,860,54,800);x.fillText(T.ct,600,296);
  const ln=(y,w)=>{x.strokeStyle='#c9972e';x.lineWidth=3;x.beginPath();x.moveTo(600-w,y);x.lineTo(600-18,y);x.moveTo(600+18,y);x.lineTo(600+w,y);x.stroke();dia(600,y,8,'#a3301f')};
  ln(322,230);
  x.fillStyle='#6b5a45';x.font=`500 25px ${F}`;x.fillText(T.cc,600,362);
  x.fillStyle='#a3301f';const nw=fit(name,880,66,800);x.fillText(name,600,430);
  const uw=Math.max(nw/2+30,260);x.strokeStyle='#c9972e';x.lineWidth=3;x.beginPath();x.moveTo(600-uw,446);x.lineTo(600+uw,446);x.stroke();x.lineWidth=1.5;x.strokeStyle='#221b14';x.beginPath();x.moveTo(600-uw,452);x.lineTo(600+uw,452);x.stroke();
  x.fillStyle='#6b5a45';x.font=`500 25px ${F}`;x.fillText(T.cd,600,492);
  x.fillStyle='#221b14';const full=CFG.title+(CFG.subtitle?'  ·  '+CFG.subtitle:'');fit(full,900,42,800);x.fillText(full,600,540);
  x.fillStyle='#6b5a45';x.font=`500 22px ${F}`;x.fillText(T.cs,600,588);
  x.fillStyle='#221b14';x.font=`800 78px ${F}`;x.fillText(fmt(sc)+' / '+fmt(tot),600,664);
  /* date box (left) */
  x.fillStyle='#f1e6c6';x.fillRect(150,580,200,92);x.strokeStyle='#221b14';x.lineWidth=2.5;x.strokeRect(150,580,200,92);x.strokeStyle='#c9972e';x.lineWidth=2;x.strokeRect(156,586,188,80);
  x.fillStyle='#6b5a45';x.font=`600 18px ${F}`;x.fillText(T.dt,250,612);
  x.fillStyle='#221b14';x.font=`700 26px ${F}`;x.fillText(new Date().toLocaleDateString('en-GB'),250,650);
  /* seal (right) */
  const sx=950,sy=624;x.fillStyle='#a3301f';x.beginPath();x.moveTo(sx-34,sy+40);x.lineTo(sx-52,sy+104);x.lineTo(sx-24,sy+88);x.lineTo(sx-6,sy+108);x.lineTo(sx+4,sy+50);x.closePath();x.fill();
  x.beginPath();x.moveTo(sx+34,sy+40);x.lineTo(sx+52,sy+104);x.lineTo(sx+24,sy+88);x.lineTo(sx+6,sy+108);x.lineTo(sx-4,sy+50);x.closePath();x.fill();

 const run=()=>{if(CFG.avatar){const im=new Image();im.onload=()=>draw(im);im.onerror=()=>draw(null);im.src=CFG.avatar}else draw(null)};
 (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(run,run)}
/* ---------- results to the teacher's Google Sheet ---------- */
const EP=CFG.endpoint||'',PEND='exam-pending:'+(CFG.sheet||CFG.title);
function payload(sc,tot){const c=[],a=[];Q.forEach((q,i)=>{c[q.n]=ok(i)?q.m:0;a[q.n]=has(i)?String(S.ans[i]):''});
 let m=(Date.now()-(S.t0||Date.now()))/6e4;if(CFG.minutes)m=Math.min(m,CFG.minutes);
 return{id:S.seed+'-'+(S.t0||0),exam:CFG.sheet||CFG.title,secNames:SEC.map(s=>s.name),name:S.name||'Student',email:S.mail||'',proof:S.proof||'',score:sc,total:tot,
  sections:SEC.map((_,k)=>Q.reduce((x,q,i)=>x+(q.s===k&&ok(i)?q.m:0),0)),mins:Math.round(m*10)/10,tabs:S.tabs||0,correct:c,answers:a}}
async function post(p){const r=await fetch(EP,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)});return(await r.json()).ok===true}
function note(t,c,retry){const n=$('#sent');n.hidden=false;n.style.color=c;n.textContent=t+' ';if(retry){const b=document.createElement('a');b.href='#';b.textContent=T.retry;b.onclick=e=>{e.preventDefault();retry()};n.appendChild(b)}}
async function send(sc,tot,p){if(!EP)return;p=p||payload(sc,tot);note(T.sending,'var(--mute)');
 try{if(!await post(p))throw 0;try{localStorage.removeItem(PEND)}catch(e){}note(T.sent,'var(--ok)')}
 catch(e){try{localStorage.setItem(PEND,JSON.stringify(p))}catch(_){}note(T.sfail,'var(--red)',()=>send(sc,tot,p))}}
/* ---------- Google sign-in: the student must prove their Gmail before the exam starts ---------- */
const GID=CFG.googleClientId||'',NEEDMAIL=!!EP&&!!GID&&CFG.requireEmail!==false;let GAUTH=null;
function gate(text,withButton){$('#gate').hidden=!text;$('#gtxt').textContent=text;$('#gbtn').hidden=!withButton}
function loadGsi(){return new Promise((ok,fail)=>{if(window.google&&google.accounts)return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=fail;document.head.appendChild(s)})}
async function verify(credential,name){const r=await fetch(EP,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'verify',credential,name})}),d=await r.json();return d.ok===true?{email:d.email,proof:d.proof}:null}
async function askGoogle(name){gate(T.noreg,true);
 try{await loadGsi()}catch(e){gate(T.chkfail);return}
 google.accounts.id.initialize({client_id:GID,auto_select:true,callback:async r=>{gate(T.chk);
  try{GAUTH=await verify(r.credential,name)}catch(e){gate(T.chkfail);return}
  if(!GAUTH){gate(T.noreg,true);return}
  gate('');enter(name)}});
 $('#gbtn').replaceChildren();google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',locale:AR?'ar':'en'})}
function enter(name){start({name,seed:Date.now()%1e9,end:CFG.minutes?Date.now()+CFG.minutes*6e4:0,ans:{},mk:{},seen:{},cur:0,tabs:0,t0:Date.now(),sig:SIG,mail:GAUTH?GAUTH.email:'',proof:GAUTH?GAUTH.proof:''})}
/* ---------- init ---------- */
document.documentElement.lang=AR?'ar':'en';document.documentElement.dir=AR?'rtl':'ltr';document.title=CFG.title;
document.querySelectorAll('[data-u]').forEach(e=>e.textContent=T[e.dataset.u]);
$('#ttl').textContent=CFG.title;$('#sub').textContent=CFG.subtitle||'';$('#sub').hidden=!CFG.subtitle;
$('#by').textContent=[CFG.teacher,CFG.credential].filter(Boolean).join(' · ');$('#tch').textContent=CFG.teacher;
['#avi','#avt'].forEach(s=>{if(CFG.avatar){$(s).src=CFG.avatar;$(s).alt=CFG.teacher}else $(s).hidden=true});
{let n=0,t=0;SEC.forEach(s=>s.items.forEach(i=>{n++;t+=i.marks??s.marks??1}));
 $('#st1').textContent=fmt(t);$('#st2').textContent=SEC.length;$('#st3').textContent=CFG.minutes?CFG.minutes+' '+T.min:T.nolimit}
$('#ins').innerHTML=`<li>${T.i1}</li><li>${T.i2}</li>`+(hasAudio?`<li>${T.i3}</li>`:'');
$('#nm').placeholder=T.nameph;if(!CFG.minutes)$('#tm').hidden=true;
$('#nm').oninput=()=>{$('#nmerr').hidden=true;$('#nm').style.borderColor='';gate('')};
$('#go').onclick=()=>{const nm=$('#nm').value.trim();if(nm.length<2){$('#nmerr').hidden=false;$('#nm').style.borderColor='var(--red)';$('#nm').focus();return}
 NEEDMAIL&&!GAUTH?askGoogle(nm):enter(nm)};

$('#mapbtn').onclick=openMap;$('#closemap').onclick=closeMap;$('#shade').onclick=closeMap;
$('#sub1').onclick=ask;$('#mno').onclick=()=>$('#modal').hidden=true;$('#myes').onclick=finish;
$('#rvb').onclick=()=>{$('#rev').hidden=!$('#rev').hidden};
document.addEventListener('visibilitychange',()=>{if(S&&!S.done&&document.hidden){S.tabs++;save()}});
document.addEventListener('keydown',e=>{if(!S||S.done||$('#exam').hidden||!$('#modal').hidden||e.ctrlKey||e.metaKey||e.altKey)return;

 if(k==='ArrowRight'||k==='ArrowLeft'){if(inp&&k.length>1&&false)return;const fwd=(k==='ArrowRight')!==AR;if(inp)return;if(fwd)$('#next').click();else if(!$('#prev').disabled)$('#prev').click();return}
 if(inp)return;
 if(k==='m'||k==='M'){$('#mark').click();return}
 const i=/^[a-hA-H]$/.test(k)?k.toUpperCase().charCodeAt(0)-65:/^[1-8]$/.test(k)?+k-1:-1;
 const o=i>=0&&document.querySelectorAll('.opt')[i];if(o)o.click()});
